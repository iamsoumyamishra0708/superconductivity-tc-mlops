version: '3.8'

services:
  api:
    build: .
    container_name: superconductor_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: .
    container_name: superconductor_frontend
    command: python -m streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: always